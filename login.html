<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Iniciar sesión · Ventas-24</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF1EF; --surface:#FFFFFF; --surface-2:#E4E9E7;
    --ink:#1B2430; --ink-soft:#5C6670; --ink-faint:#8B949C;
    --steel:#2B4562; --rust:#C1631A;
    --danger:#B3361E; --danger-bg:#F7E4DF;
    --line:#D6DBD8;
    --shadow: 0 1px 2px rgba(15,33,54,.06), 0 6px 20px -8px rgba(15,33,54,.18);
    --font-display:'Big Shoulders Display','Arial Narrow',sans-serif;
    --font-body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#12181F; --surface:#1A222B; --surface-2:#212B35;
      --ink:#E7EBEE; --ink-soft:#A6B0B9; --ink-faint:#6C7680;
      --steel:#7FA8D4; --rust:#E28A46;
      --danger:#E88871; --danger-bg:#3A1E18;
      --line:#2C3742;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px -10px rgba(0,0,0,.55);
      color-scheme: dark;
    }
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--paper); color:var(--ink); font-family:var(--font-body);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    width:100%; max-width:360px; background:var(--surface); border:1px solid var(--line);
    border-radius:16px; padding:32px 28px; box-shadow:var(--shadow);
  }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:24px; }
  .brand .mark{ width:32px; height:32px; flex:none; }
  .brand .mark svg{ width:100%; height:100%; display:block; }
  .brand span{ font-family:var(--font-display); font-weight:800; font-size:18px; }
  h1{ font-family:var(--font-display); font-size:20px; font-weight:700; margin:0 0 4px; }
  .sub{ color:var(--ink-soft); font-size:13px; margin-bottom:22px; }
  label{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; }
  input{
    width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:9px;
    padding:11px 12px; font-size:14px; color:var(--ink); font-family:var(--font-body); margin-bottom:16px;
  }
  input:focus-visible{ outline:2px solid var(--rust); outline-offset:1px; }
  button{
    width:100%; cursor:pointer; background:var(--steel); color:#fff; border:none; border-radius:9px;
    padding:12px; font-size:14px; font-weight:600; font-family:var(--font-body);
  }
  button:disabled{ opacity:.6; cursor:default; }
  .error{
    background:var(--danger-bg); color:var(--danger); border-radius:9px; padding:9px 12px;
    font-size:12.5px; margin-bottom:16px; display:none;
  }
  .error.show{ display:block; }

  /* ===== Tema obsidiana ===== */
  :root{ --paper:#f4efe6; --surface:rgba(255,255,255,.7); --surface-2:rgba(255,255,255,.86); --ink:#1d1812; --ink-soft:#5b5043; --ink-faint:#8c7f6e;
    --steel:#8a6528; --rust:#a67c32; --danger:#a8324a; --danger-bg:rgba(168,50,74,.11); --line:rgba(70,50,20,.18);
    --shadow:0 28px 70px -30px rgba(60,40,10,.45), inset 0 1px 0 rgba(255,255,255,.9); }
  @media (prefers-color-scheme: dark){ :root{ --paper:#0b0a0d; --surface:rgba(255,255,255,.055); --surface-2:rgba(255,255,255,.09); --ink:#f2ede3; --ink-soft:#bdb3a2; --ink-faint:#8b8274;
    --steel:#cfae6c; --rust:#e8d3a2; --danger:#e0768a; --danger-bg:rgba(224,118,138,.13); --line:rgba(255,255,255,.13);
    --shadow:0 34px 80px -30px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.14); } }
  body{ background:var(--paper); }
  body::before{ content:""; position:fixed; inset:-6vmax; z-index:-1; pointer-events:none; animation:aurora 90s ease-in-out infinite alternate;
    background:radial-gradient(55vmax 46vmax at 90% -10%, rgba(140,70,95,.24), transparent 62%), radial-gradient(50vmax 44vmax at -8% 106%, rgba(40,110,85,.20), transparent 60%), radial-gradient(38vmax 32vmax at 52% 55%, rgba(190,150,70,.08), transparent 62%); }
  @keyframes aurora{ from{ transform:translate3d(0,0,0) scale(1); } to{ transform:translate3d(-1.5vmax,1vmax,0) scale(1.04); } }
  .card{ background-image:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.015) 48%,rgba(255,255,255,.05)); -webkit-backdrop-filter:blur(22px) saturate(125%); backdrop-filter:blur(22px) saturate(125%); border:1px solid var(--line); }
  h1, .brand span{ font-family:'Cormorant Garamond','Iowan Old Style',Georgia,serif; }
  h1{ font-size:28px; font-weight:600; letter-spacing:-.005em; } .brand span{ font-size:24px; font-weight:700; }
  input{ background:var(--surface-2); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
  button{ background:linear-gradient(180deg,#e8d3a2,#cfae6c); color:#1b1407; border:1px solid #9c7f3f; box-shadow:0 1px 2px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.4); letter-spacing:.02em; }
  @media (prefers-color-scheme: light){ button{ background:linear-gradient(180deg,#a67c32,#8a6528); color:#fff; border-color:#6f511b; } }
  button:hover:not(:disabled){ filter:brightness(1.06); }
  .brand .mark circle{ fill:#1d1914; stroke:#cfae6c; stroke-width:5; } .brand .mark path[fill="#2B4562"]{ fill:#1d1914; } .brand .mark path[fill="#C1631A"]{ fill:#cfae6c; }
  @media (prefers-reduced-motion: reduce){ body::before{ animation:none; } }
</style>
</head>
<body>
<form class="card" id="form">
  <div class="brand">
    <span class="mark"><svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs><clipPath id="markClip"><circle cx="100" cy="100" r="88"/></clipPath></defs>
      <circle cx="100" cy="100" r="88" fill="#2B4562"/>
      <g clip-path="url(#markClip)"><path d="M100 12 L188 12 L188 100 Z" fill="#C1631A"/></g>
      <path d="M55 68 h90 a10 10 0 0 1 10 10 v46 a10 10 0 0 1 -10 10 h-52 l-20 18 v-18 h-18 a10 10 0 0 1 -10 -10 v-46 a10 10 0 0 1 10 -10 z" fill="#FFFFFF"/>
      <path d="M104 78 L88 98 h10 L96 118 L118 94 h-14 Z" fill="#2B4562"/>
    </svg></span>
    <span>Ventas-24</span>
  </div>
  <h1>Iniciar sesión</h1>
  <div class="sub">Entra con la cuenta que te crearon.</div>
  <div class="error" id="error"></div>
  <label for="email">Correo</label>
  <input type="email" id="email" autocomplete="username" required>
  <label for="password">Contraseña</label>
  <input type="password" id="password" autocomplete="current-password" required>
  <button type="submit" id="btn">Entrar</button>
</form>
<form class="card" id="cambio" hidden>
  <h1>Crea tu contraseña</h1>
  <div class="sub">Entraste con una clave temporal. Elige una propia (mínimo 10 caracteres).</div>
  <div class="error" id="errorCambio"></div>
  <label for="nueva">Contraseña nueva</label>
  <input type="password" id="nueva" autocomplete="new-password" minlength="10" required>
  <label for="nueva2">Repítela</label>
  <input type="password" id="nueva2" autocomplete="new-password" minlength="10" required>
  <button type="submit">Guardar y entrar</button>
</form>
<script>
  function irAdestino(){
    const next = new URLSearchParams(location.search).get('next') || '';
    location.href = (next.startsWith('/') && !next.startsWith('//')) ? next : '/crm';
  }
  function mostrarCambio(actual){
    document.getElementById('form').hidden = true;
    const f = document.getElementById('cambio'); f.hidden = false;
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const eb = document.getElementById('errorCambio'); eb.classList.remove('show');
      const n1 = document.getElementById('nueva').value, n2 = document.getElementById('nueva2').value;
      if (n1 !== n2){ eb.textContent = 'Las dos contraseñas no coinciden'; eb.classList.add('show'); return; }
      const r = await fetch('/api/crm/cambiar-password', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'same-origin',
        body: JSON.stringify({ actual, nueva: n1 }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok){ eb.textContent = d.error || 'No se pudo cambiar'; eb.classList.add('show'); return; }
      irAdestino();
    });
  }
  const form = document.getElementById('form');
  const errBox = document.getElementById('error');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errBox.classList.remove('show');
    const btn = document.getElementById('btn');
    btn.disabled = true; btn.textContent = 'Entrando…';
    try {
      const password = document.getElementById('password').value;
      const r = await fetch('/api/crm/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({
          email: document.getElementById('email').value.trim(),
          password,
        }),
      });
      if (!r.ok){
        const d = await r.json().catch(() => ({}));
        throw new Error(d.error || ('HTTP ' + r.status));
      }
      const d = await r.json().catch(() => ({}));
      if (d.debe_cambiar){ mostrarCambio(password); return; }
      irAdestino();
    } catch(err){
      errBox.textContent = err.message;
      errBox.classList.add('show');
      btn.disabled = false; btn.textContent = 'Entrar';
    }
  });
</script>
</body>
</html>
