services:
  - type: web
    name: ventas24
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app_whatsapp:app --bind 0.0.0.0:$PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: CRM_DB_PATH
        value: /var/data/crm.db
    disk:
      name: crm-data
      mountPath: /var/data
      sizeGB: 1
