  function aplicarTema(t) { if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t); try { if (t === "auto") localStorage.removeItem("v24mov-tema"); else localStorage.setItem("v24mov-tema", t); } catch (e) { /* sin almacenamiento */ } }

  /* ---------------- conexión y arranque ---------------- */

  window.addEventListener("online", pintarRed); window.addEventListener("offline", pintarRed);
  window.addEventListener("pagehide", detenerCamara);
  window.__mov = { leer: alLeer, estado: S, decodificarLienzo: decodificarLienzo, prepararMotores: prepararMotores };   // para pruebas
